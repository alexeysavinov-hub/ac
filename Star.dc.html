    return { wrap: this.wrap, core: this.core, rings: this.rings, sparks: this.sparks, onMove: this.onMove, onLeave: this.onLeave, replay: this.replay, showSparkles: this.props.sparkles ?? true, showRings: this.props.rings ?? true, radiant: this.props.radiant ?? false };
  }
}
